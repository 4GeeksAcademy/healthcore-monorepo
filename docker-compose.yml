name: healthcore

services:
  uis:
    build:
      context: .
      dockerfile: uis/Dockerfile
    container_name: healthcore-uis
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uis_node_modules:/app/node_modules
    depends_on:
      - services

  services:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: healthcore-services
    ports:
      - "8000:8000"
    volumes:
      - ./services/incident-api:/services/incident-api

volumes:
  uis_node_modules: